name: Build workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lk-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python 2.7 (CPython)
        run: |
          sudo apt-get update
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          python --version
          python -c "import sys; print(sys.version)"
          command -v python

      - name: Verify PBP signing library
        run: |
          ls -l tools/pbp/lib
          cd tools/pbp
          python -c "import lib; print('lib ->', lib.__file__)"
          python -c "import lib.gfh, lib.cert; print('PBP lib OK')"

      - name: Cache GCC for Android
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: ~/gcc-toolchain
          key: gcc-toolchain-e9b2ab0932573a0ca90cad11ab75d9619f19c458

      - name: Download GCC for Android
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 "$HOME/gcc-toolchain"
          cd "$HOME/gcc-toolchain"
          git checkout e9b2ab0932573a0ca90cad11ab75d9619f19c458

      - name: Verify GCC
        run: |
          "$HOME/gcc-toolchain/bin/arm-linux-androideabi-gcc" --version

      - name: Build the bootloader
        shell: bash
        run: |
          set -eo pipefail

          export PATH="$HOME/gcc-toolchain/bin:$PATH"
          export python="$(command -v python)"

          export MTK_PROJECT=k65v1_64_bsp
          export PRELOADER_OUT="$GITHUB_WORKSPACE/build-k65v1_64_bsp"
          export CROSS_COMPILE="$HOME/gcc-toolchain/bin/arm-linux-androideabi-"

          make

      - name: Verify build output
        run: |
          echo "Checking build output..."
          find build-k65v1_64_bsp -type f -name 'preloader_k65v1_64_bsp.bin' -print

          if [ ! -f build-k65v1_64_bsp/bin/preloader_k65v1_64_bsp.bin ]; then
            echo "::error::preloader_k65v1_64_bsp.bin was not generated at the expected path."
            exit 1
          fi

      - name: Upload bootloader
        uses: actions/upload-artifact@v4
        with:
          name: preloader_k65v1_64_bsp
          path: build-k65v1_64_bsp/bin/preloader_k65v1_64_bsp.bin
          if-no-files-found: error
